[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ted-harvester"
version = "0.1.0"
description = "IRIS-SIG-50: TED procurement notice harvester for grid cabling, transformers and data centres"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "pyproj>=3.6", "psycopg[binary]>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ted-harvester = "ted_harvester.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["integration: needs PostgreSQL/PostGIS (set TED_TEST_DSN)"]
