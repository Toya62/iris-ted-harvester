[project]
name = "ted-harvester"
version = "0.2.0"
description = "IRIS-SIG-50: EU TED notices -> PostGIS iris_staging.signal_ingest"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "psycopg[binary]>=3.1", "pyproj>=3.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ted-harvest = "ted_harvester.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: integration tests requiring a live PostgreSQL/PostGIS database",
]
